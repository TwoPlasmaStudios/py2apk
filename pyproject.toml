[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py2apk"
version = "2.5.0"
description = "Turn a Python script into an Android APK from a terminal UI - no Docker, no compiling on your machine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TwoPlasmaStudios" }]
keywords = ["android", "apk", "python", "packaging", "tui", "flask", "webview"]
dependencies = ["textual>=0.80"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
icon = ["pillow"]

[project.urls]
Homepage = "https://github.com/TwoPlasmaStudios/py2apk"
Issues = "https://github.com/TwoPlasmaStudios/py2apk/issues"

[project.scripts]
py2apk = "py2apk:main"

[tool.setuptools]
py-modules = ["py2apk"]
