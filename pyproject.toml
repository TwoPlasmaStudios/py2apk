[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "py2apk"
version = "0.3.0"
description = "GUI ile Python -> APK (hazir derlenmis CPython ve kutuphaneler)"
requires-python = ">=3.10"

[project.optional-dependencies]
icon = ["pillow"]

[project.gui-scripts]
py2apk = "py2apk:main"

[tool.setuptools]
py-modules = ["py2apk"]
